[project]
name = "farm-tracker"
version = "0.1.0"
description = "Private agent-managed task lists through Farm MCP"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "markdown-it-py>=3,<5",
    "PyJWT[crypto]>=2.10,<3",
    "python-dateutil>=2.9,<3",
    "waitress>=3,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["src/tracker"]
